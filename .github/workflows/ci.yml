name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: macOS ${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        macos: ['14', '26']
    runs-on: macos-${{ matrix.macos }}
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
